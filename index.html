<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פורטל הדוחות</title>
    <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api@main/lib/tableau.extensions.1.latest.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="top-nav">
        <div class="brand" id="brandLogo" title="חזרה לדף הראשי">
            <img src="./logo_portal.png" alt="לוגו הפורטל" class="brand-logo-img">
            <div class="brand-text">
                <span class="brand-title">פורטל הדוחות</span>
                <span class="brand-subtitle">מבוסס Tableau Server</span>
            </div>
        </div>
        <nav class="category-tabs" id="categoryTabs">
            <!-- כפתורי קטגוריות דינמיים -->
        </nav>
    </header>

    <!-- MAIN VIEW: Categories Level -->
    <main id="mainView" class="view-container active">
        <section class="hero-section">
            <!-- לוגו ימין למעלה בתוך הבאנר הסגול -->
            <div class="hero-icon-wrapper">
    <svg class="hero-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
        <line x1="6" y1="12" x2="6" y2="8"></line>
        <line x1="10" y1="12" x2="10" y2="6"></line>
        <line x1="14" y1="12" x2="14" y2="9"></line>
        <line x1="18" y1="12" x2="18" y2="7"></line>
    </svg>
</div>
            <h1>כל הדוחות של הארגון במקום אחד</h1>
            <div class="search-box-wrapper">
                <input type="text" id="globalSearchInput" placeholder="חיפוש דשבורד בכל הקטגוריות..." autocomplete="off">
                <img src="./search.png" alt="חיפוש" class="search-icon-img" onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'), {className: 'search-icon', textContent: '🔍'}));">
                <ul id="autocompleteList" class="autocomplete-dropdown"></ul>
            </div>
        </section>

        <section class="content-section">
            <h2>קטגוריות</h2>
            <div class="categories-grid" id="categoriesGrid"></div>
        </section>
    </main>

    <!-- SUB VIEW: Dashboard Level -->
    <main id="subView" class="view-container">
        <div class="sub-header-nav">
            <button class="btn-back" id="btnBack">→ חזרה לכל הקטגוריות</button>
        </div>
        
        <div class="category-title-area">
            <h1 id="selectedCategoryTitle">שם הקטגוריה</h1>
            <p id="selectedCategoryDesc" class="category-desc"></p>
        </div>

        <div class="filter-bar">
            <div class="search-box-wrapper search-sub">
                <input type="text" id="subSearchInput" placeholder="חיפוש דשבורד בקטגוריה..." autocomplete="off">
                <img src="./search.png" alt="חיפוש" class="search-icon-img" onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'), {className: 'search-icon', textContent: '🔍'}));">
                <ul id="subAutocompleteList" class="autocomplete-dropdown"></ul>
            </div>
        </div>

        <div class="dashboards-list" id="dashboardsList"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
